version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-doc-postgres
    environment:
      POSTGRES_DB: smart_doc
      POSTGRES_USER: smart_doc
      POSTGRES_PASSWORD: smart_doc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart-doc-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: smart-doc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
